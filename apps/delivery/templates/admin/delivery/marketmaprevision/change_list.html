{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
  {% for bazar in market_map_bazars %}
    <li>
      <a href="{% url 'admin:delivery_market_map_editor' bazar.id %}" class="addlink">
        Карта: {{ bazar.name }}
      </a>
    </li>
  {% empty %}
    <li><span>Сначала добавьте базар</span></li>
  {% endfor %}
  {{ block.super }}
{% endblock %}
