services:
  db:
    image: postgres:16
    container_name: dogo-db
    restart: always
    environment:
      POSTGRES_DB: dogo
      POSTGRES_USER: dogo
      POSTGRES_PASSWORD: dogo_pass_123
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "False"
      CHANNEL_BACKEND: "redis"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dogo-net

  redis:
    image: redis:7
    container_name: dogo-redis
    restart: always
    networks:
      - dogo-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dogo-web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    environment:
      DJANGO_ALLOWED_HOSTS: "dordoi-go.tech,www.dordoi-go.tech,164.92.182.171,localhost"
      POSTGRES_DB: dogo
      POSTGRES_USER: dogo
      POSTGRES_PASSWORD: dogo_pass_123
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "False"
    depends_on:
      - db
      - redis
    volumes:
      - ..:/app
    networks:
      - dogo-net

  nginx:
    image: nginx:1.27
    container_name: dogo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static_root:/app/static_root:ro
      - ../media:/app/media:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - web
    networks:
      - dogo-net

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:

networks:  
  dogo-net:
    driver: bridge



