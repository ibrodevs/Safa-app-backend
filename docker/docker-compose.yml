services:

  db:
    image: postgres:16-alpine
    container_name: dogo-db
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dogo-net

  redis:
    image: redis:7-alpine
    container_name: dogo-redis
    restart: unless-stopped
    networks:
      - dogo-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dogo-web
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ..:/app
      - ../static_root:/app/static_root
      - ../media:/app/media
    networks:
      - dogo-net

  backup:
    image: postgres:16-alpine
    container_name: dogo-backup
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ../backups:/backups
      - ../scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/start_backup.sh"]
    networks:
      - dogo-net

volumes:
  postgres_data:

networks:
  dogo-net:
    driver: bridge
