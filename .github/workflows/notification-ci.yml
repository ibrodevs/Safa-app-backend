name: Notification checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/notification/**'
      - '.env.example'
      - '.github/workflows/notification-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: test-secret-key
      DJANGO_USE_SQLITE: '1'
      CHANNEL_BACKEND: memory
      ENABLE_DEBUG_OTP_ENDPOINT: '0'
      STATIC_OTP: ''
      GOOGLE_MAPS_BROWSER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: req.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt
          pip install pytest pytest-django

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Run notification tests
        run: |
          python -m pytest \
            apps/notification/test_fcm_client.py \
            apps/notification/test_fcm_platforms.py \
            apps/notification/test_notification_roles.py \
            -vv --tb=short
