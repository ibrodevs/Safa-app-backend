name: Market map backend checks

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/delivery/map_*.py
      - apps/delivery/migrations/0017_market_map_revision.py
      - apps/delivery/test_market_map.py
      - tests/test_map_point_resolution.py
      - apps/delivery/urls.py
      - apps/delivery/apps.py
      - .github/workflows/market-map-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: test-secret-key
      DJANGO_USE_SQLITE: '1'
      CHANNEL_BACKEND: memory
      GOOGLE_MAPS_BROWSER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: req.txt

      - name: Install dependencies
        run: |
          pip install -r req.txt
          pip install pytest pytest-django

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run market map tests
        run: |
          set +e
          python -m pytest apps/delivery/test_market_map.py tests/test_map_point_resolution.py -vv --tb=short --junitxml=market-map-results.xml > market-map-output.txt 2>&1
          code=$?
          echo "$code" > market-map-exit-code.txt
          cat market-map-output.txt
          exit 0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-map-test-report
          path: |
            market-map-results.xml
            market-map-output.txt
            market-map-exit-code.txt
          if-no-files-found: error

      - name: Fail when tests failed
        run: test "$(cat market-map-exit-code.txt)" = "0"
