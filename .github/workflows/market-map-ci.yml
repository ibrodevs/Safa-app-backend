name: Market map backend checks

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/delivery/map_*.py
      - apps/delivery/migrations/0017_market_map_revision.py
      - apps/delivery/test_market_map.py
      - apps/delivery/urls.py
      - apps/delivery/apps.py
      - .github/workflows/market-map-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: test-secret-key
      DJANGO_USE_SQLITE: '1'
      CHANNEL_BACKEND: memory
      GOOGLE_MAPS_BROWSER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: req.txt

      - name: Install dependencies
        run: pip install -r req.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run market map tests
        run: pytest apps/delivery/test_market_map.py -q
