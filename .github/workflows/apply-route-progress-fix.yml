name: Apply route progress fix

on:
  push:
    branches:
      - agent/full-system-hardening
    paths:
      - tool/apply_route_progress_fix.py
      - .github/workflows/apply-route-progress-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-system-hardening
          fetch-depth: 0
      - run: python tool/apply_route_progress_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/delivery/serializer.py apps/delivery/test_contracts.py
          git commit -m "fix shipment route progression"
          git push origin HEAD:agent/full-system-hardening
