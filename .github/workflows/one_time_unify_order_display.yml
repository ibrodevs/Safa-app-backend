name: One-time unify order display

on:
  push:
    branches: [agent/unify-order-display-and-pricing]
    paths: [.github/workflows/one_time_unify_order_display.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry one-time order API display refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-order-display-and-pricing
          fetch-depth: 0
      - name: Apply focused refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/delivery/serializer.py')
          s = p.read_text()
          import_line = 'from .specialists import point_inside_bazar\n'
          assert import_line in s
          s = s.replace(
              import_line,
              import_line + 'from .map_point_resolver import resolve_market_point\n',
              1,
          )

          stop_block = '''class ShipmentStopReadSerializer(serializers.ModelSerializer):
              bazar = serializers.SerializerMethodField()
              district = serializers.SerializerMethodField()
              passage = serializers.SerializerMethodField()
              container = serializers.SerializerMethodField()
              label = serializers.SerializerMethodField()

              class Meta:
                  model = ShipmentStop
                  fields = [
                      "position",
                      "title",
                      "lat",
                      "lon",
                      "bazar",
                      "district",
                      "passage",
                      "container",
                      "label",
                  ]

              def _resolved_market_point(self, obj: ShipmentStop):
                  if not obj.container_id or obj.lat is None or obj.lon is None:
                      return None
                  cache = self.context.setdefault("_safa_market_stop_cache", {})
                  if obj.container_id not in cache:
                      match = resolve_market_point(float(obj.lat), float(obj.lon))
                      if match is not None and match.container.id != obj.container_id:
                          match = None
                      cache[obj.container_id] = match
                  return cache[obj.container_id]

              def get_bazar(self, obj: ShipmentStop):
                  match = self._resolved_market_point(obj)
                  if match is not None:
                      return match.bazar_name
                  return obj.container.passage.bazar.name if obj.container_id else None

              def get_district(self, obj: ShipmentStop):
                  match = self._resolved_market_point(obj)
                  return match.district_name if match is not None and match.district_name else None

              def get_passage(self, obj: ShipmentStop):
                  match = self._resolved_market_point(obj)
                  if match is not None:
                      return match.passage_number
                  return obj.container.passage.number if obj.container_id else None

              def get_container(self, obj: ShipmentStop):
                  match = self._resolved_market_point(obj)
                  if match is not None:
                      return match.container_number
                  return obj.container.number if obj.container_id else None

              def get_label(self, obj: ShipmentStop):
                  parts = []
                  bazar = self.get_bazar(obj)
                  district = self.get_district(obj)
                  passage = self.get_passage(obj)
                  container = self.get_container(obj)
                  if bazar:
                      parts.append(f"Базар: {bazar}")
                  if district:
                      parts.append(f"Район: {district}")
                  if passage:
                      parts.append(f"Проход: {passage}")
                  if container:
                      parts.append(f"Контейнер: {container}")
                  return " · ".join(parts) or (obj.title or "")
          '''.replace('          ', '')
          pattern = re.compile(
              r'class ShipmentStopReadSerializer\(serializers\.ModelSerializer\):.*?\n\nMAX_SHIPMENT_STOPS = 30',
              re.S,
          )
          assert pattern.search(s), 'ShipmentStopReadSerializer not found'
          s = pattern.sub(stop_block.rstrip() + '\n\n\nMAX_SHIPMENT_STOPS = 30', s, count=1)

          nearby_block = '''class ShipmentNearbySerializer(serializers.ModelSerializer):
              distance_m = serializers.SerializerMethodField()
              stops = ShipmentStopReadSerializer(many=True, read_only=True)
              stops_count = serializers.SerializerMethodField()
              commission = serializers.SerializerMethodField()
              courier_income = serializers.SerializerMethodField()

              class Meta:
                  model = Shipment
                  fields = (
                      "id",
                      "public_code",
                      "title",
                      "service_type",
                      "description",
                      "estimated_fare",
                      "final_fare",
                      "commission",
                      "courier_income",
                      "status",
                      "created_at",
                      "finished_at",
                      "is_paid",
                      "paid_at",
                      "distance_m",
                      "stops_count",
                      "stops",
                  )

              def get_stops_count(self, obj) -> int:
                  return obj.stops.count()

              def get_commission(self, obj) -> int:
                  return obj.commission_amount

              def get_courier_income(self, obj) -> int:
                  return obj.courier_income

              def get_distance_m(self, obj) -> int | None:
                  lat = self.context.get("user_lat")
                  lon = self.context.get("user_lon")
                  if lat is None or lon is None:
                      return None

                  stop = obj.stops.order_by("position").first()
                  if not stop or stop.lat is None or stop.lon is None:
                      return None

                  d = haversine_m(lat, lon, float(stop.lat), float(stop.lon))
                  return int(round(d))
          '''.replace('          ', '')
          pattern = re.compile(
              r'class ShipmentNearbySerializer\(serializers\.ModelSerializer\):.*\Z',
              re.S,
          )
          assert pattern.search(s), 'ShipmentNearbySerializer not found'
          s = pattern.sub(nearby_block.rstrip() + '\n', s, count=1)
          p.write_text(s)

          p = Path('tests/test_map_point_resolution.py')
          s = p.read_text()
          import_old = 'from apps.delivery.map_point_resolver import resolve_market_point\n'
          assert import_old in s
          s = s.replace(
              import_old,
              import_old + 'from apps.delivery.serializer import ShipmentDetailSerializer, ShipmentNearbySerializer\n',
              1,
          )
          assert 'test_shipment_serializers_share_compact_map_hierarchy_and_fare' not in s
          s += '''\n\n@pytest.mark.django_db\ndef test_shipment_serializers_share_compact_map_hierarchy_and_fare(mapped_container):\n    user = User.objects.create(phone_number="996555009876", first_name="Client")\n    shipment = Shipment.objects.create(\n        client=user,\n        title="Реальный заказ",\n        service_type=Shipment.ServiceType.DELIVERY,\n        estimated_fare=275,\n        final_fare=0,\n    )\n    ShipmentStop.objects.create(\n        shipment=shipment,\n        position=0,\n        container=mapped_container,\n    )\n\n    detail = ShipmentDetailSerializer(shipment).data\n    nearby = ShipmentNearbySerializer(\n        shipment,\n        context={"user_lat": 42.9, "user_lon": 74.6},\n    ).data\n\n    expected = {\n        "bazar": "Дордой",\n        "district": "Центральный",\n        "passage": "8",\n        "container": "125",\n        "label": "Базар: Дордой · Район: Центральный · Проход: 8 · Контейнер: 125",\n    }\n    for key, value in expected.items():\n        assert detail["stops"][0][key] == value\n        assert nearby["stops"][0][key] == value\n\n    assert detail["estimated_fare"] == nearby["estimated_fare"] == 275\n    assert nearby["service_type"] == Shipment.ServiceType.DELIVERY\n    assert nearby["stops_count"] == 1\n    assert nearby["commission"] == shipment.commission_amount\n    assert nearby["courier_income"] == shipment.courier_income\n'''
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/delivery/serializer.py tests/test_map_point_resolution.py
          git commit -m "Unify shipment data for clients and specialists"
          git push origin HEAD:agent/unify-order-display-and-pricing
