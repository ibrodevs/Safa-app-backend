<header class="topbar">
  <div class="topbar__context"><button class="icon-button mobile-menu" type="button" data-sidebar-open aria-label="Открыть меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="topbar__crumb">SAFA</span><span class="topbar__slash">/</span><strong>{{ page_title }}</strong></div>
  <div class="global-search" data-global-search>
    <label class="sr-only" for="global-search-input">Глобальный поиск</label>
    <span class="global-search__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></span><input id="global-search-input" type="search" placeholder="Найти заказ, пользователя, контейнер…" autocomplete="off">
    <div class="search-results" id="global-search-results" hidden></div>
  </div>
  <div class="admin-menu"><button class="icon-button mobile-search" type="button" data-search-open aria-label="Открыть поиск"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><a href="{% url 'admin_panel:password_change' %}" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit;" title="Мой профиль и смена пароля"><span class="avatar avatar--sm">{{ request.user.first_name|default:request.user.phone_number|slice:':1'|upper }}</span><span class="admin-menu__name">{{ request.user.first_name|default:request.user.phone_number }}</span></a><form method="post" action="{% url 'admin_panel:logout' %}">{% csrf_token %}<button class="btn btn-ghost" type="submit">Выйти</button></form></div>
</header>
